# Nginx config for ejournal-back
# 1. Copy: sudo cp deploy/nginx-ejournal.conf /etc/nginx/sites-available/ejournal-api
# 2. Enable: sudo ln -s /etc/nginx/sites-available/ejournal-api /etc/nginx/sites-enabled/
# 3. Test: sudo nginx -t && sudo systemctl reload nginx
# 4. SSL: sudo certbot --nginx -d api.uzfintex.uz -d www.api.uzfintex.uz
#    Certbot will add listen 443 ssl and certificate paths automatically.

server {
    listen 80;
    listen [::]:80;
    server_name api.uzfintex.uz www.api.uzfintex.uz;

    # reverse proxy for ejournal backend (gunicorn on port 8000)
    location / {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
    }

    location /media/ {
        alias /var/www/ejournal-back/media/;
    }

    location /static/ {
        alias /var/www/ejournal-back/staticfiles/;
    }
}
