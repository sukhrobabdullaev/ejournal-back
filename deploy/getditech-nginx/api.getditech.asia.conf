# STEP 1 — use this before running certbot (HTTP only)
# Copy to: /etc/nginx/sites-available/ejournal-api
# Enable:  ln -s /etc/nginx/sites-available/ejournal-api /etc/nginx/sites-enabled/
# Test:    nginx -t && systemctl restart nginx
# Then:    certbot --nginx -d api.getditech.asia
#
# STEP 2 — after certbot runs it rewrites this file with SSL automatically.
#          The final result will look like the HTTPS block below.
#          You can replace the certbot-generated version with the clean one below.

server {
    listen 80;
    listen [::]:80;
    server_name api.getditech.asia;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.getditech.asia;

    # Reverse proxy to Gunicorn running in Docker on host port 8002
    location / {
        proxy_pass http://localhost:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
    }

    # Serve user uploads directly (bypasses Django/Gunicorn)
    location /media/ {
        alias /var/www/ejournal-back/media/;
    }

    # Serve Django collectstatic output directly
    location /static/ {
        alias /var/www/ejournal-back/staticfiles/;
    }

    ssl_certificate /etc/letsencrypt/live/api.getditech.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.getditech.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
