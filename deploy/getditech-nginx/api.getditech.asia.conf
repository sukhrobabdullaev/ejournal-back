server {
    listen 80;
    listen [::]:80;
    server_name api.getditech.asia;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.getditech.asia;

    location / {
        proxy_pass http://localhost:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
    }

    location /media/ {
        alias /var/www/ejournal-back/media/;
    }

    location /static/ {
        alias /var/www/ejournal-back/staticfiles/;
    }

    ssl_certificate /etc/letsencrypt/live/api.getditech.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.getditech.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
