server {
    listen 80;
    listen [::]:80;
    server_name getditech.asia www.getditech.asia;
    return 301 https://$host$request_uri;
}

server {
    server_name getditech.asia www.getditech.asia;

    root /var/www/ejournal-front/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/getditech.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getditech.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
