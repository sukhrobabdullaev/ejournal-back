# STEP 1 — use this before running certbot (HTTP only)
# Copy to: /etc/nginx/sites-available/ejournal-front
# Enable:  ln -s /etc/nginx/sites-available/ejournal-front /etc/nginx/sites-enabled/
# Test:    nginx -t && systemctl restart nginx
# Then:    certbot --nginx -d getditech.asia -d www.getditech.asia
#
# STEP 2 — after certbot runs it rewrites this file with SSL automatically.
#          The final result will look like the HTTPS block below.
#          You can replace the certbot-generated version with the clean one below.

server {
    listen 80;
    listen [::]:80;
    server_name getditech.asia www.getditech.asia;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name getditech.asia www.getditech.asia;

    root /var/www/ejournal-front/build;
    index index.html;

    # SPA routing — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets for 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    ssl_certificate /etc/letsencrypt/live/getditech.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getditech.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
